<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="warm-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5983A" />
      <stop offset="50%" stop-color="#C86446" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="pine-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52795D" />
      <stop offset="100%" stop-color="#2D4434" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Organic Rounded Badge (Acoustic Pick / Hearth Shape) -->
  <path d="M 50 8 C 76 8, 92 26, 88 56 C 84 80, 60 92, 50 94 C 40 92, 16 80, 12 56 C 8 26, 24 8, 50 8 Z" 
        fill="#1A1512" stroke="#E5983A" stroke-width="2" stroke-opacity="0.4" />

  <!-- Inner Soft Accent Ring -->
  <path d="M 50 14 C 72 14, 85 29, 82 54 C 79 74, 58 85, 50 87 C 42 85, 21 74, 18 54 C 15 29, 28 14, 50 14 Z" 
        fill="none" stroke="#E5983A" stroke-width="0.75" stroke-dasharray="2 3" stroke-opacity="0.35" />

  <!-- Monogram T & W (Crafted Precision) -->
  <!-- Crossbar of T -->
  <path d="M 28 28 Q 50 25 72 28" stroke="#F5EFEB" stroke-width="3" stroke-linecap="round" />
  
  <!-- Stem of T descending to W apex -->
  <line x1="50" y1="27" x2="50" y2="48" stroke="#F5EFEB" stroke-width="3" stroke-linecap="round" />

  <!-- Harmonic W with Guitar Pick & Pine Ridge Flow -->
  <!-- Left wing of W -->
  <path d="M 30 46 L 40 74 L 50 50 L 60 74 L 70 46" 
        stroke="url(#warm-wood)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Pine / Acoustic Soundhole Accent Node -->
  <circle cx="50" cy="50" r="3.5" fill="#E5983A" filter="url(#soft-glow)" />

  <!-- Pine Needle / Craft Node at Base -->
  <circle cx="50" cy="86" r="1.5" fill="#52795D" />
</svg>
